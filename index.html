<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遙控機器人自走車 | RC Robot Car</title>
<style>
  :root {
    --bg: #0d1420;
    --bg-2: #131c2b;
    --accent: #22c6f0;
    --accent-2: #ff8a76;
    --text: #eaf2f8;
    --text-dim: #8ea3b5;
    --surface: rgba(255, 255, 255, 0.06);
    --surface-strong: rgba(255, 255, 255, 0.1);
    --border: rgba(34, 198, 240, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body {
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: rgba(13, 20, 32, 0.7);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  header .logo {
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 1.1rem;
    color: var(--accent);
  }
  header nav a {
    color: var(--text-dim);
    text-decoration: none;
    margin-left: 28px;
    font-size: 0.9rem;
    transition: color 0.2s;
  }
  header nav a:hover { color: var(--accent); }

  .hero {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-container {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .hero-text {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    text-align: center;
    pointer-events: none;
    width: max-content;
    max-width: 90vw;
  }
  .hero-text h1 {
    font-size: clamp(2.8rem, 9vw, 6rem);
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(34, 198, 240, 0.25);
  }
  .hero-text p {
    margin-top: 16px;
    color: var(--text-dim);
    font-size: 1.1rem;
    letter-spacing: 1px;
  }
  .scroll-hint {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: var(--text-dim);
    font-size: 0.8rem;
    letter-spacing: 2px;
    animation: bob 2s infinite ease-in-out;
  }
  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.5; }
    50% { transform: translate(-50%, 8px); opacity: 1; }
  }

  .speech-bubble {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--bg);
    padding: 6vh 8vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .speech-bubble.show {
    opacity: 1;
    pointer-events: auto;
  }
  .speech-bubble .title {
    color: var(--accent);
    font-weight: 700;
    font-size: clamp(1.3rem, 3vw, 2rem);
    letter-spacing: 1px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .speech-bubble p {
    color: var(--text);
    font-size: clamp(1rem, 2vw, 1.3rem);
    line-height: 2;
    margin-bottom: 16px;
  }
  .speech-bubble p b {
    color: var(--accent-2);
  }
  .speech-bubble .close-btn {
    position: absolute;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.8rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .speech-bubble .close-btn:hover { color: var(--text); }

  .back-btn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 1rem;
    letter-spacing: 1px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s, transform 0.2s;
  }
  .back-btn:hover {
    background: var(--surface-strong);
    transform: translateY(-2px);
  }

  .qr-btn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    z-index: 4;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s, transform 0.2s;
  }
  .qr-btn:hover {
    background: var(--surface-strong);
    transform: translateY(-2px);
  }

  .qr-panel {
    position: absolute;
    bottom: 96px;
    right: 30px;
    z-index: 4;
    background: rgba(19, 28, 43, 0.97);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    text-align: center;
  }
  .qr-panel.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .qr-panel #qrcode {
    background: #fff;
    padding: 10px;
    border-radius: 10px;
    line-height: 0;
  }
  .qr-panel p {
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--text-dim);
    word-break: break-all;
    max-width: 160px;
  }

  .rules-btn {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 16px 28px;
    border-radius: 999px;
    font-size: 1.15rem;
    letter-spacing: 1px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.2s, transform 0.2s;
  }
  .rules-btn:hover {
    background: var(--surface-strong);
    transform: translateX(-50%) translateY(-2px);
  }

  section {
    padding: 100px 8vw;
    position: relative;
  }
  .section-title {
    text-align: center;
    margin-bottom: 60px;
  }
  .section-title h2 {
    font-size: 2.2rem;
    letter-spacing: 2px;
  }
  .section-title span {
    color: var(--accent);
  }
  .section-title p {
    color: var(--text-dim);
    margin-top: 10px;
  }

  .features {
    background: var(--bg-2);
  }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 28px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .feature-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    cursor: default;
  }
  .feature-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(34, 198, 240, 0.18);
  }
  .feature-card .icon {
    font-size: 2rem;
    margin-bottom: 16px;
  }
  .feature-card h3 {
    font-size: 1.15rem;
    margin-bottom: 10px;
    color: var(--text);
  }
  .feature-card p {
    font-size: 0.92rem;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .specs table {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    border-collapse: collapse;
    font-size: 0.95rem;
  }
  .specs th, .specs td {
    padding: 16px 20px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .specs th {
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 1px;
    width: 30%;
  }
  .specs td {
    color: var(--text-dim);
  }
  .specs tr:hover td, .specs tr:hover th {
    color: var(--text);
  }

  .usage {
    background: var(--bg-2);
  }
  .steps {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .step {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    background: var(--surface);
    border: 1px solid rgba(255, 138, 118, 0.2);
    border-radius: 12px;
    padding: 20px 24px;
  }
  .step .num {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #0a1018;
  }
  .step h4 {
    margin-bottom: 6px;
  }
  .step p {
    color: var(--text-dim);
    font-size: 0.92rem;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-size: 0.85rem;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
</style>
</head>
<body>

<header>
  <div class="logo">RC ROBOT CAR</div>
</header>

<section class="hero" id="hero">
  <div id="canvas-container"></div>
  <div class="hero-text">
    <h1>足球機器人</h1>
    <p>操控自走車，把乒乓球踢進球門 — 遙控射門大挑戰</p>
  </div>
  <button class="rules-btn" id="rulesBtn">❓ 遊戲規則</button>

  <div class="speech-bubble" id="speechBubble">
    <button class="close-btn" id="bubbleClose">✕</button>
    <div class="title">🎮 這個怎麼玩？</div>
    <p>這是<b>足球機器人</b>！用遙控器操控這台自走車，把乒乓球踢進對方球門就得分。</p>
    <p>遙控器是四方形搖桿，四個角各有一顆按鈕：</p>
    <p>⬆️ <b>左上 + 右上同時按</b> → 前進　　⬇️ <b>左下 + 右下同時按</b> → 後退</p>
    <p>↪️ <b>右上</b> → 右轉　　↩️ <b>左上</b> → 左轉</p>
    <p>↘️ <b>右下</b> → 往後右轉　　↙️ <b>左下</b> → 往後左轉</p>
    <button class="back-btn" id="bubbleBack">返回</button>
  </div>

  <button class="qr-btn" id="qrBtn" aria-label="顯示網站 QR Code">⬜</button>
  <div class="qr-panel" id="qrPanel">
    <div id="qrcode"></div>
    <p>掃描分享這個網站</p>
  </div>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    45, container.clientWidth / container.clientHeight, 0.1, 1000
  );
  camera.position.set(6, 4.5, 7);
  camera.lookAt(0, 0.5, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lights (daylight setup)
  const ambient = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(ambient);

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcfe0ea, 0.9);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xfff6e0, 1.5);
  keyLight.position.set(5, 8, 5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1024, 1024);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.7);
  fillLight.position.set(-3, 6, 6);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xff6b5e, 0.35);
  rimLight.position.set(-6, 3, -4);
  scene.add(rimLight);

  // --- Robot Car Group ---
  const car = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e2a38, metalness: 0.6, roughness: 0.35 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0x00e0ff, emissive: 0x00465a, metalness: 0.4, roughness: 0.3 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x0d1117, metalness: 0.3, roughness: 0.7 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x88e0ff, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.7 });
  const redMat = new THREE.MeshStandardMaterial({ color: 0xff5f6d, emissive: 0x5a1015 });

  // Main chassis
  const chassisGeo = new THREE.BoxGeometry(3.2, 0.6, 2.0);
  const chassis = new THREE.Mesh(chassisGeo, bodyMat);
  chassis.position.y = 0;
  chassis.castShadow = true;
  car.add(chassis);

  // Chassis accent stripe
  const stripeGeo = new THREE.BoxGeometry(3.22, 0.15, 0.3);
  const stripe = new THREE.Mesh(stripeGeo, accentMat);
  stripe.position.set(0, 0.05, 0);
  car.add(stripe);

  // Upper body / cabin
  const cabinGeo = new THREE.BoxGeometry(1.6, 0.5, 1.6);
  const cabin = new THREE.Mesh(cabinGeo, bodyMat);
  cabin.position.set(-0.3, 0.55, 0);
  cabin.castShadow = true;
  car.add(cabin);

  // Cabin glass dome (sensor housing)
  const domeGeo = new THREE.SphereGeometry(0.35, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
  const dome = new THREE.Mesh(domeGeo, glassMat);
  dome.position.set(0.7, 0.8, 0);
  dome.castShadow = true;
  car.add(dome);

  // Front camera lens
  const lensGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.15, 16);
  const lens = new THREE.Mesh(lensGeo, darkMat);
  lens.rotation.z = Math.PI / 2;
  lens.position.set(1.68, 0.3, 0);
  car.add(lens);
  const lensGlassGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.02, 16);
  const lensGlass = new THREE.Mesh(lensGlassGeo, accentMat);
  lensGlass.rotation.z = Math.PI / 2;
  lensGlass.position.set(1.76, 0.3, 0);
  car.add(lensGlass);

  // Antenna
  const antennaGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.0, 8);
  const antenna = new THREE.Mesh(antennaGeo, darkMat);
  antenna.position.set(-0.9, 1.15, 0.5);
  antenna.rotation.z = 0.2;
  car.add(antenna);
  const antennaTipGeo = new THREE.SphereGeometry(0.05, 8, 8);
  const antennaTip = new THREE.Mesh(antennaTipGeo, redMat);
  antennaTip.position.set(-1.0, 1.6, 0.5);
  car.add(antennaTip);

  // Ultrasonic sensor "eyes" on front
  [-0.35, 0.35].forEach((z) => {
    const eyeGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.08, 12);
    const eye = new THREE.Mesh(eyeGeo, accentMat);
    eye.rotation.z = Math.PI / 2;
    eye.position.set(1.62, -0.05, z);
    car.add(eye);
  });

  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.4, 20);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111418, roughness: 0.9, metalness: 0.1 });
  const hubMat = new THREE.MeshStandardMaterial({ color: 0x00e0ff, emissive: 0x003a44 });

  const wheels = [];
  const wheelPositions = [
    [1.1, -0.35, 1.15],
    [1.1, -0.35, -1.15],
    [-1.1, -0.35, 1.15],
    [-1.1, -0.35, -1.15],
  ];
  wheelPositions.forEach((pos) => {
    const wheelGroup = new THREE.Group();
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.x = Math.PI / 2;
    wheel.castShadow = true;
    wheelGroup.add(wheel);

    const hubGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.42, 12);
    const hub = new THREE.Mesh(hubGeo, hubMat);
    hub.rotation.x = Math.PI / 2;
    wheelGroup.add(hub);

    wheelGroup.position.set(pos[0], pos[1], pos[2]);
    car.add(wheelGroup);
    wheels.push(wheelGroup);
  });

  // Glowing edge outlines on every part of the car body, so its silhouette
  // reads clearly against the dark background.
  function addGlowEdges(root) {
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x22c6f0, transparent: true, opacity: 0.85 });
    const meshes = [];
    root.traverse((obj) => { if (obj.isMesh) meshes.push(obj); });
    meshes.forEach((mesh) => {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 20);
      const line = new THREE.LineSegments(edges, edgeMat);
      mesh.add(line);
    });
  }
  addGlowEdges(car);

  car.position.y = 0.4;
  scene.add(car);

  // --- Figure (person holding the controller) ---
  const figure = new THREE.Group();

  const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8b894, roughness: 0.7 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: 0x2f6f8f, roughness: 0.6 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1c2733, roughness: 0.7 });
  const ctrlMat = new THREE.MeshStandardMaterial({ color: 0x0d1117, metalness: 0.4, roughness: 0.4 });
  const btnMat = new THREE.MeshStandardMaterial({ color: 0x00e0ff, emissive: 0x004a55 });

  // legs
  const legGeo = new THREE.CylinderGeometry(0.16, 0.16, 1.1, 12);
  [-0.18, 0.18].forEach((x) => {
    const leg = new THREE.Mesh(legGeo, pantsMat);
    leg.position.set(x, 0.55, 0);
    leg.castShadow = true;
    figure.add(leg);
  });

  // torso
  const torsoGeo = new THREE.CylinderGeometry(0.38, 0.32, 0.9, 12);
  const torso = new THREE.Mesh(torsoGeo, shirtMat);
  torso.position.set(0, 1.55, 0);
  torso.castShadow = true;
  figure.add(torso);

  // head
  const headGeo = new THREE.SphereGeometry(0.28, 16, 16);
  const head = new THREE.Mesh(headGeo, skinMat);
  head.position.set(0, 2.28, 0);
  head.castShadow = true;
  figure.add(head);

  // arms - both bent forward holding the controller
  const armGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.7, 10);
  [-0.42, 0.42].forEach((x) => {
    const arm = new THREE.Mesh(armGeo, shirtMat);
    arm.position.set(x, 1.65, 0.35);
    arm.rotation.x = -Math.PI / 2.4;
    arm.castShadow = true;
    figure.add(arm);
  });

  // controller (square gamepad) held out in front, pointing forward
  const controller = new THREE.Group();
  const padGeo = new THREE.BoxGeometry(0.55, 0.55, 0.12);
  const pad = new THREE.Mesh(padGeo, ctrlMat);
  pad.castShadow = true;
  controller.add(pad);

  const btnGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.05, 12);
  [[-0.18, 0.18], [0.18, 0.18], [-0.18, -0.18], [0.18, -0.18]].forEach(([x, y]) => {
    const btn = new THREE.Mesh(btnGeo, btnMat);
    btn.rotation.x = Math.PI / 2;
    btn.position.set(x, y, 0.09);
    controller.add(btn);
  });

  const antGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.3, 6);
  const ant = new THREE.Mesh(antGeo, ctrlMat);
  ant.rotation.z = Math.PI / 2;
  ant.position.set(0.3, 0, 0);
  controller.add(ant);

  controller.rotation.x = -Math.PI / 2;
  controller.position.set(0, 1.55, 0.75);
  figure.add(controller);

  figure.position.set(-3.2, 0, 2.4);
  figure.rotation.y = -0.5;
  scene.add(figure);

  // --- Interaction: drag to rotate, wheel to zoom ---
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let targetRotY = 0.6, targetRotX = 0.15;
  let currentRotY = 0.6, currentRotX = 0.15;
  let radius = 9.5;
  let targetRadius = 9.5;

  container.style.cursor = 'grab';

  container.addEventListener('mousedown', (e) => {
    isDragging = true;
    prevX = e.clientX;
    prevY = e.clientY;
    container.style.cursor = 'grabbing';
  });
  window.addEventListener('mouseup', () => {
    isDragging = false;
    container.style.cursor = 'grab';
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    prevX = e.clientX;
    prevY = e.clientY;
    targetRotY += dx * 0.008;
    targetRotX += dy * 0.005;
    targetRotX = Math.max(-0.3, Math.min(0.8, targetRotX));
  });

  // touch support
  container.addEventListener('touchstart', (e) => {
    isDragging = true;
    prevX = e.touches[0].clientX;
    prevY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchend', () => { isDragging = false; });
  window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - prevX;
    const dy = e.touches[0].clientY - prevY;
    prevX = e.touches[0].clientX;
    prevY = e.touches[0].clientY;
    targetRotY += dx * 0.008;
    targetRotX += dy * 0.005;
    targetRotX = Math.max(-0.3, Math.min(0.8, targetRotX));
  }, { passive: true });

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetRadius += e.deltaY * 0.01;
    targetRadius = Math.max(4, Math.min(18, targetRadius));
  }, { passive: false });

  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    clock.getDelta();

    currentRotY += (targetRotY - currentRotY) * 0.08;
    currentRotX += (targetRotX - currentRotX) * 0.08;
    radius += (targetRadius - radius) * 0.08;

    camera.position.x = radius * Math.sin(currentRotY) * Math.cos(currentRotX);
    camera.position.z = radius * Math.cos(currentRotY) * Math.cos(currentRotX);
    camera.position.y = radius * Math.sin(currentRotX) + 1.5;
    camera.lookAt(0, 0.5, 0);

    // idle bobbing + auto rotate slightly if not dragging
    if (!isDragging) {
      targetRotY += 0.0015;
    }
    car.position.y = 0.4 + Math.sin(t * 1.5) * 0.05;

    // idle wheel spin
    wheels.forEach((w) => {
      w.children[0].rotation.y += 0.04;
    });

    renderer.render(scene, camera);
  }
  animate();

  // Speech bubble: auto show after load, reopenable via button or canvas click
  const bubble = document.getElementById('speechBubble');
  const bubbleClose = document.getElementById('bubbleClose');
  const bubbleBack = document.getElementById('bubbleBack');
  const rulesBtn = document.getElementById('rulesBtn');
  setTimeout(() => bubble.classList.add('show'), 900);
  bubbleClose.addEventListener('click', () => bubble.classList.remove('show'));
  bubbleBack.addEventListener('click', () => bubble.classList.remove('show'));
  rulesBtn.addEventListener('click', () => bubble.classList.add('show'));

  let dragMoved = false;
  container.addEventListener('mousedown', () => { dragMoved = false; });
  window.addEventListener('mousemove', () => { if (isDragging) dragMoved = true; });
  container.addEventListener('click', () => {
    if (!dragMoved) bubble.classList.add('show');
  });

  // QR code: links to this site's GitHub Pages URL so it can be scanned
  // and shared. Generated once on load (qrcodejs draws into #qrcode).
  const qrBtn = document.getElementById('qrBtn');
  const qrPanel = document.getElementById('qrPanel');
  const siteUrl = 'https://tim72117.github.io/rcrobot/';
  new QRCode(document.getElementById('qrcode'), {
    text: siteUrl,
    width: 140,
    height: 140,
    colorDark: '#0d1420',
    colorLight: '#ffffff',
  });
  qrBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    qrPanel.classList.toggle('show');
  });
  document.addEventListener('click', (e) => {
    if (qrPanel.classList.contains('show') && !qrPanel.contains(e.target) && e.target !== qrBtn) {
      qrPanel.classList.remove('show');
    }
  });
})();
</script>
